<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator | CodeAlpha</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculator-container">

        <div class="calculator">

            <div class="top-bar">
                <span>CALCULATOR</span>
                <span class="brand">CodeAlpha</span>
            </div>

            <div class="display">
                <div id="previous-display"></div>
                <div id="current-display">0</div>
            </div>

            <div class="buttons">

                <button class="btn function" data-action="clear">AC</button>
                <button class="btn function" data-action="delete">DEL</button>
                <button class="btn operator" data-action="percent">%</button>
                <button class="btn operator" data-operation="divide">÷</button>

                <button class="btn" data-number="7">7</button>
                <button class="btn" data-number="8">8</button>
                <button class="btn" data-number="9">9</button>
                <button class="btn operator" data-operation="multiply">×</button>

                <button class="btn" data-number="4">4</button>
                <button class="btn" data-number="5">5</button>
                <button class="btn" data-number="6">6</button>
                <button class="btn operator" data-operation="subtract">−</button>

                <button class="btn" data-number="1">1</button>
                <button class="btn" data-number="2">2</button>
                <button class="btn" data-number="3">3</button>
                <button class="btn operator" data-operation="add">+</button>

                <button class="btn zero" data-number="0">0</button>
                <button class="btn" data-number=".">.</button>
                <button class="btn equals" data-action="equals">=</button>

            </div>

        </div>

        <p class="footer">CodeAlpha Frontend Development Internship</p>

    </main>

    <script src="script.js"></script>
</body>
</html>
